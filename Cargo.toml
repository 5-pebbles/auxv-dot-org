[package]
name = "auxv-dot-org"
version = "0.2.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.4"
clap = { version = "4.6.0", features = ["derive", "env"] }
either = "1.15.0"
log = "0.4.29"
pulldown-cmark = "0.13.3"
rocket = { git = "https://github.com/rwf2/Rocket.git", version = "0.6.0-dev", features = ["json", "tls"] }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls-acme = { version = "0.15.1", features = ["ring", "tokio"] }
subtle = "2.6.1"
time = "0.3.47"
tokio = { version = "1.51.0", features = ["net"] }
tokio-rustls = "0.26.4"
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["compat"] }

[dev-dependencies]
scraper = "0.26.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
